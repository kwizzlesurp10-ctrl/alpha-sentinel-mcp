name: alpha-sentinel-mcp

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha-sentinel-mcp:local
    restart: unless-stopped
    env_file:
      - .env.defaults
    environment:
      HOST: "0.0.0.0"
      PORT: "8403"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8403}
      X402_PAY_TO_ADDRESS: ${X402_PAY_TO_ADDRESS:-}
      X402_DEFAULT_NETWORK: ${X402_DEFAULT_NETWORK:-eip155:84532}
      TRUST_FORWARDED_HOST: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${HOST_BIND:-127.0.0.1}:8403:8403"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:80:80"
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
