#cloud-config
hostname: alpha-sentinel-mcp
manage_etc_hosts: true
package_update: true
package_upgrade: true

users:
  - name: sentinel
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys: []

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - qemu-guest-agent
  - python3
  - python3-venv
  - docker.io
  - docker-compose-v2

write_files:
  - path: /etc/alpha-sentinel-mcp.env
    owner: root:sentinel
    permissions: "0640"
    content: |
      HOST=0.0.0.0
      PORT=8403
      PUBLIC_BASE_URL=http://127.0.0.1:8403
      X402_DEFAULT_NETWORK=eip155:84532

runcmd:
  - systemctl enable --now qemu-guest-agent docker fail2ban
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt
  - git clone https://github.com/kwizzlesurp10-ctrl/alpha-sentinel-mcp.git /opt/alpha-sentinel-mcp
  - chown -R sentinel:sentinel /opt/alpha-sentinel-mcp
  - install -m 0644 /opt/alpha-sentinel-mcp/deploy/systemd/alpha-sentinel-mcp.service /etc/systemd/system/alpha-sentinel-mcp.service
  - cd /opt/alpha-sentinel-mcp && docker compose --env-file /etc/alpha-sentinel-mcp.env up -d --build
  - systemctl daemon-reload

final_message: "Alpha Sentinel MCP guest is ready. Map host ports 80/443/8403 to this VM."
