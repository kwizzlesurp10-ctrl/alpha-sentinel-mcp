services:
  - type: web
    name: alpha-sentinel-api
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: X402_PAY_TO_ADDRESS
        sync: false
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: FREE_TIER_MONTHLY_QUOTA
        value: "500"
      - key: PRO_TIER_MONTHLY_QUOTA
        value: "50000"
      - key: KEY_PROVIDER
        value: "env"
      - key: X402_DEFAULT_NETWORK
        value: "eip155:8453"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BAZAAR_DISCOVERABLE
        value: "true"
