[project]
name = "alpha-sentinel-mcp"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0,<1.0.0",
  "x402[httpx,evm,fastapi,extensions]>=2.14.0",
  "jsonschema>=4.0.0",
  "eth-account>=0.13.0",
  "PyJWT>=2.8.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Our own deprecations must fail the suite; web3's legacy websockets import is third-party.
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
ignore = ["BLE001", "DTZ003", "ASYNC230", "S110", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"app/x402_services.py" = ["BLE001", "TRY004"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
ignore_errors = true

[tool.vercel]
entrypoint = "api.index:app"
